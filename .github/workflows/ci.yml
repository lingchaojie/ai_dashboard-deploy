name: Deployment scripts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check scripts and configuration
        run: |
          bash -n deploy/install.sh deploy/gateway.sh
          shellcheck deploy/install.sh deploy/gateway.sh
          python3 -m unittest discover -s deploy/tests -v
          docker compose -f deploy/compose.yaml config --quiet
          DOMAIN=dashboard.example.com docker compose -f deploy/compose.yaml -f deploy/compose.https.yaml config --quiet
